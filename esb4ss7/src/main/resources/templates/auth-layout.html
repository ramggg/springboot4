<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE | TaskManager">TaskManager</title>

    <!-- Bootstrap 5.3 CSS (served locally via WebJar) -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/dist/css/bootstrap.min.css}">

    <!-- Bootstrap Icons (served locally via WebJar) -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-bg min-vh-100 d-flex flex-column align-items-center justify-content-center py-5">

    <div class="w-100" style="max-width: 440px; padding: 0 1rem;">

        <!-- Logo / Branding -->
        <div class="text-center mb-4">
            <div class="auth-logo-icon mx-auto mb-3">
                <i class="bi bi-check2-square text-white" style="font-size: 2rem;"></i>
            </div>
            <h1 class="h2 fw-bold text-white mb-1">TaskManager</h1>
            <p class="text-white-75 mb-0">Simple &amp; Effective Task Management</p>
        </div>

        <!-- Auth Card -->
        <div class="card border-0 shadow-lg rounded-4">
            <div class="card-body p-4 p-md-5">
                <div layout:fragment="content">
                    <!-- Auth page content will be inserted here -->
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap 5.3 JS Bundle (served locally via WebJar) -->
    <script th:src="@{/webjars/bootstrap/5.3.3/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
