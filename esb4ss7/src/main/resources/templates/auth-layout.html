<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE | TaskManager">TaskManager</title>

    <!-- Custom Design System CSS -->
    <link rel="stylesheet" href="/css/style.css">

    <style>
        /* Auth-specific styles */
        body {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            min-height: 100vh;
        }
        
        .auth-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
        }
        
        .auth-content {
            width: 100%;
            max-width: 420px;
        }
        
        .auth-logo {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }
        
        .auth-logo h1 {
            font-size: var(--font-size-4xl);
            color: var(--color-bg-white);
            margin-bottom: var(--spacing-md);
            font-weight: 700;
        }
        
        .auth-logo p {
            color: rgba(255, 255, 255, 0.9);
            font-size: var(--font-size-base);
            margin-bottom: 0;
        }
        
        .card {
            width: 100%;
        }
        
        .auth-divider {
            text-align: center;
            margin: var(--spacing-lg) 0;
            color: var(--color-text-light);
            font-size: var(--font-size-sm);
            position: relative;
        }
        
        .auth-divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: calc(50% - var(--spacing-md));
            height: 1px;
            background-color: var(--color-border);
        }
        
        .auth-divider::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            width: calc(50% - var(--spacing-md));
            height: 1px;
            background-color: var(--color-border);
        }
        
        .auth-footer {
            text-align: center;
            margin-top: var(--spacing-lg);
            color: var(--color-text-light);
            font-size: var(--font-size-sm);
        }
        
        .auth-footer a {
            color: var(--color-primary);
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .auth-wrapper {
                padding: var(--spacing-md);
            }
            
            .auth-content {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Auth Wrapper -->
    <div class="auth-wrapper">
        <div class="auth-content">
            <!-- Logo/Header -->
            <div class="auth-logo">
                <h1>TaskManager</h1>
                <p>Simple & Effective Task Management</p>
            </div>

            <!-- Auth Card -->
            <div class="card">
                <div class="card-body">
                    <div layout:fragment="content">
                        <!-- Auth page content will be inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
