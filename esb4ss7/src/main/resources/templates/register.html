<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{auth-layout}">
<head>
    <title>Register</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="text-center mb-4 fw-bold" style="color: var(--color-dark);">Create Your Account</h2>

    <!-- Registration Form -->
    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" class="form-control" th:field="*{username}" placeholder="Choose a username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control" th:field="*{password}" placeholder="Create a strong password" required>
            <p class="form-text">At least 8 characters for better security</p>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="width: 100%; margin-top: var(--spacing-lg);">
            Create Account
        </button>
    </form>

    <!-- Divider -->
    <div class="auth-divider">or</div>

    <!-- Sign In Link -->
    <div class="auth-footer">
        <p>Already have an account? <a th:href="@{/login}">Sign in here</a></p>
    </div>
</div>
</body>
</html>
