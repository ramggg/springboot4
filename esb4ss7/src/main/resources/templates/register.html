<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{auth-layout}">
<head>
    <title>Register</title>
</head>
<body>
<div layout:fragment="content">

    <h2 class="h4 fw-bold text-center mb-1 text-dark">Create Your Account</h2>
    <p class="text-center text-muted small mb-4">Join TaskManager and start organising today</p>

    <!-- Registration Form -->
    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label fw-semibold small text-dark">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-person text-muted"></i>
                </span>
                <input type="text" id="username"
                       class="form-control border-start-0 ps-0"
                       th:field="*{username}"
                       placeholder="Choose a username"
                       required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label fw-semibold small text-dark">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-lock text-muted"></i>
                </span>
                <input type="password" id="password"
                       class="form-control border-start-0 ps-0"
                       th:field="*{password}"
                       placeholder="Create a strong password"
                       required>
            </div>
            <div class="form-text ps-1">
                <i class="bi bi-info-circle me-1"></i>At least 8 characters recommended for better security.
            </div>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg fw-semibold rounded-3">
                <i class="bi bi-person-plus me-2"></i>Create Account
            </button>
        </div>
    </form>

    <!-- Divider -->
    <div class="auth-divider">or</div>

    <!-- Sign In Link -->
    <p class="text-center text-muted small mb-0">
        Already have an account?
        <a th:href="@{/login}" class="text-primary fw-semibold text-decoration-none">Sign in here</a>
    </p>

</div>
</body>
</html>
