<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>My Tasks</title>
</head>
<body>
<div layout:fragment="content">

    <!-- ===== PAGE HEADER ===== -->
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
            <h1 class="h3 fw-bold text-dark mb-1">
                <i class="bi bi-list-task text-primary me-2"></i>My Tasks
            </h1>
            <p class="text-muted mb-0 small">Manage and track all your tasks in one place.</p>
        </div>
        <a th:href="@{/tasks/new}" class="btn btn-primary fw-semibold rounded-3 px-4">
            <i class="bi bi-plus-lg me-2"></i>New Task
        </a>
    </div>

    <!-- ===== TASK CARD ===== -->
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">

        <!-- Empty State -->
        <div th:if="${tasks.isEmpty()}" class="text-center py-5 px-3">
            <div class="empty-state-icon mb-3">
                <i class="bi bi-inbox text-muted" style="font-size: 2rem;"></i>
            </div>
            <h5 class="fw-semibold text-dark mb-2">No Tasks Yet</h5>
            <p class="text-muted mb-4 small">You have no tasks at the moment. Create one to get started!</p>
            <a th:href="@{/tasks/new}" class="btn btn-primary rounded-3 px-4 fw-semibold">
                <i class="bi bi-plus-lg me-2"></i>Create Your First Task
            </a>
        </div>

        <!-- Tasks Table -->
        <div th:if="${!tasks.isEmpty()}" class="table-responsive">
            <table class="table table-hover align-middle mb-0 table-tasks">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4 py-3 text-uppercase small fw-bold text-muted" style="letter-spacing:0.05em;">Title</th>
                        <th class="py-3 text-uppercase small fw-bold text-muted" style="letter-spacing:0.05em;">Due Date</th>
                        <th class="py-3 text-uppercase small fw-bold text-muted" style="letter-spacing:0.05em;">Status</th>
                        <th class="py-3 text-uppercase small fw-bold text-muted text-end pe-4" style="letter-spacing:0.05em;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="task : ${tasks}">
                        <td class="ps-4 py-3">
                            <span class="fw-semibold text-dark" th:text="${task.title}"></span>
                        </td>
                        <td class="py-3">
                            <th:block th:if="${task.dueDate}">
                                <span class="text-muted small">
                                    <i class="bi bi-calendar3 me-1"></i>
                                    <span th:text="${#temporals.format(task.dueDate, 'MMM dd, yyyy')}"></span>
                                </span>
                            </th:block>
                            <th:block th:unless="${task.dueDate}">
                                <span class="text-muted small fst-italic">Not set</span>
                            </th:block>
                        </td>
                        <td class="py-3">
                            <span class="badge rounded-pill px-3 py-2 small fw-semibold"
                                  th:text="${task.status}"
                                  th:classappend="${task.status == 'Done'        ? 'badge-done' :
                                                  (task.status == 'In Progress'  ? 'badge-inprogress' :
                                                                                   'badge-todo')}">
                            </span>
                        </td>
                        <td class="py-3 pe-4">
                            <div class="d-flex gap-2 justify-content-end">
                                <a th:href="@{/tasks/edit/{id}(id=${task.id})}"
                                   class="btn btn-outline-primary btn-sm rounded-3 fw-semibold">
                                    <i class="bi bi-pencil me-1"></i>Edit
                                </a>
                                <form th:action="@{/tasks/delete/{id}(id=${task.id})}" method="post" class="m-0">
                                    <button type="submit"
                                            class="btn btn-outline-danger btn-sm rounded-3 fw-semibold"
                                            onclick="return confirm('Are you sure you want to delete this task?')">
                                        <i class="bi bi-trash me-1"></i>Delete
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- ===== FOOTER NOTE ===== -->
    <div th:if="${!tasks.isEmpty()}" class="text-muted small text-center mt-3">
        <i class="bi bi-info-circle me-1"></i>
        Showing all your tasks. Use <strong>Edit</strong> to update status or details.
    </div>

</div>
</body>
</html>
