<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${task.id == null} ? 'New Task' : 'Edit Task'"></title>
</head>
<body>
<div layout:fragment="content">

    <div class="row justify-content-center">
        <div class="col-lg-7 col-xl-6">

            <!-- ===== PAGE HEADER ===== -->
            <div class="d-flex align-items-center gap-3 mb-4">
                <a th:href="@{/tasks}" class="btn btn-light btn-sm rounded-3 border">
                    <i class="bi bi-arrow-left me-1"></i>Back
                </a>
                <div>
                    <h1 class="h4 fw-bold text-dark mb-0"
                        th:text="${task.id == null} ? 'Create a New Task' : 'Edit Task'"></h1>
                    <p class="text-muted small mb-0"
                       th:text="${task.id == null} ? 'Fill in the details below to add a new task.' : 'Update the task details below.'"></p>
                </div>
            </div>

            <!-- ===== FORM CARD ===== -->
            <div class="card border-0 shadow-sm rounded-4 mb-4">
                <div class="card-body p-4 p-lg-5">
                    <form th:object="${task}"
                          th:action="${task.id == null} ? @{/tasks/new} : @{/tasks/edit/{id}(id=${task.id})}"
                          method="post">

                        <!-- Task Title -->
                        <div class="mb-4">
                            <label for="title" class="form-label fw-semibold text-dark small">
                                <i class="bi bi-tag me-1 text-primary"></i>Task Title <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control form-control-lg rounded-3"
                                   id="title" th:field="*{title}"
                                   placeholder="e.g. Review quarterly report"
                                   required>
                            <div class="form-text">Give your task a clear, descriptive name.</div>
                        </div>

                        <!-- Task Description -->
                        <div class="mb-4">
                            <label for="description" class="form-label fw-semibold text-dark small">
                                <i class="bi bi-text-left me-1 text-primary"></i>Description
                            </label>
                            <textarea class="form-control rounded-3"
                                      id="description" th:field="*{description}"
                                      placeholder="Add any notes or details about this task…"
                                      rows="4"></textarea>
                            <div class="form-text">Optional — add more context to help you remember what needs to be done.</div>
                        </div>

                        <!-- Due Date & Status (2-column on md+) -->
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="dueDate" class="form-label fw-semibold text-dark small">
                                    <i class="bi bi-calendar3 me-1 text-primary"></i>Due Date <span class="text-danger">*</span>
                                </label>
                                <input type="date" class="form-control rounded-3"
                                       id="dueDate" th:field="*{dueDate}"
                                       required>
                                <div class="form-text">When should this task be completed?</div>
                            </div>

                            <!-- Status (edit mode only) -->
                            <div class="col-md-6" th:if="${task.id != null}">
                                <label for="status" class="form-label fw-semibold text-dark small">
                                    <i class="bi bi-flag me-1 text-primary"></i>Status
                                </label>
                                <select class="form-select rounded-3" id="status" th:field="*{status}">
                                    <option value="To Do">To Do</option>
                                    <option value="In Progress">In Progress</option>
                                    <option value="Done">Done</option>
                                </select>
                                <div class="form-text">Track the progress of this task.</div>
                            </div>
                        </div>

                        <!-- Form Actions -->
                        <div class="d-flex gap-3 flex-wrap pt-2">
                            <button type="submit" class="btn btn-primary btn-lg fw-semibold px-5 rounded-3 flex-grow-1 flex-md-grow-0">
                                <i class="bi bi-check-lg me-2"></i>
                                <span th:text="${task.id == null} ? 'Create Task' : 'Update Task'"></span>
                            </button>
                            <a th:href="@{/tasks}" class="btn btn-light btn-lg border fw-semibold px-4 rounded-3">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- ===== TIP BOX ===== -->
            <div class="alert alert-info d-flex align-items-start gap-3 rounded-3 border-0 shadow-sm" style="background-color:#eff6ff;">
                <i class="bi bi-lightbulb-fill text-primary mt-1 flex-shrink-0"></i>
                <p class="mb-0 small text-muted">
                    <strong class="text-dark">Pro Tip:</strong>
                    Break down complex tasks into smaller, manageable steps for better focus and productivity.
                </p>
            </div>

        </div>
    </div>

</div>
</body>
</html>
