<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${task.id == null} ? 'New Task' : 'Edit Task'"></title>
    <style>
        .form-container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .form-divider {
            height: 1px;
            background-color: var(--color-border);
            margin: var(--spacing-xl) 0;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-lg);
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        
        .form-actions {
            display: flex;
            gap: var(--spacing-lg);
            justify-content: flex-end;
            margin-top: var(--spacing-2xl);
        }
        
        @media (max-width: 768px) {
            .form-actions {
                flex-direction: column-reverse;
            }
            
            .form-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="form-container">
        <!-- Page Title -->
        <h1 th:text="${task.id == null} ? 'Create a New Task' : 'Edit Task'" style="margin-bottom: var(--spacing-2xl);"></h1>

        <!-- Form Card -->
        <div class="card">
            <div class="card-body" style="padding: var(--spacing-2xl);">
                <form th:object="${task}" th:action="${task.id == null} ? @{/tasks/new} : @{/tasks/edit/{id}(id=${task.id})}" method="post">
                    <!-- Task Title -->
                    <div class="form-group">
                        <label for="title" class="form-label">Task Title</label>
                        <input type="text" class="form-control" id="title" th:field="*{title}" placeholder="Enter task title" required>
                        <p class="form-text">Give your task a clear, descriptive name</p>
                    </div>

                    <!-- Task Description -->
                    <div class="form-group">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" th:field="*{description}" placeholder="Add any details or notes about this task" rows="5"></textarea>
                        <p class="form-text">Optional: Add more details to help you remember what needs to be done</p>
                    </div>

                    <!-- Due Date & Status -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="dueDate" class="form-label">Due Date</label>
                            <input type="date" class="form-control" id="dueDate" th:field="*{dueDate}" required>
                            <p class="form-text">When should this task be completed?</p>
                        </div>

                        <!-- Status (only shown for editing) -->
                        <div class="form-group" th:if="${task.id != null}">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" th:field="*{status}">
                                <option value="To Do">To Do</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Done">Done</option>
                            </select>
                            <p class="form-text">Track the progress of this task</p>
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                            <span th:text="${task.id == null} ? 'Create Task' : 'Update Task'"></span>
                        </button>
                        <a th:href="@{/tasks}" class="btn btn-outline">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Info Box -->
        <div style="background-color: var(--color-bg-light); border-left: 4px solid var(--color-info); padding: var(--spacing-lg); border-radius: var(--radius-md); margin-top: var(--spacing-xl);">
            <p style="margin: 0; color: var(--color-text-light); font-size: var(--font-size-sm);">
                <strong style="color: var(--color-dark);">💡 Tip:</strong> Break down complex tasks into smaller, manageable steps for better productivity.
            </p>
        </div>
    </div>
</div>
</body>
</html>
