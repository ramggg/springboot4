<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE | TaskManager">TaskManager</title>

    <!-- Custom Design System CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- ========== HEADER ========== -->
        <header>
            <div class="container">
                <div class="navbar">
                    <!-- Logo/Brand -->
                    <a class="navbar-brand" th:href="@{/home}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        TaskManager
                    </a>

                    <!-- Navigation Menu -->
                    <ul class="navbar-menu">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/home}" th:classappend="${#httpServletRequest.getRequestURI() == '/home' ? 'active' : ''}">
                                Home
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/tasks}" th:classappend="${#httpServletRequest.getRequestURI().startsWith('/tasks') ? 'active' : ''}">
                                My Tasks
                            </a>
                        </li>
                    </ul>

                    <!-- Right Section: User & Logout -->
                    <div class="navbar-right">
                        <div class="navbar-user" sec:authorize="isAuthenticated()">
                            Welcome, <strong sec:authentication="name"></strong>
                        </div>
                        <form th:action="@{/logout}" method="post" style="margin: 0;">
                            <button type="submit" class="btn btn-secondary btn-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 0.25rem;">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                    <polyline points="16 17 21 12 16 7"></polyline>
                                    <line x1="21" y1="12" x2="9" y2="12"></line>
                                </svg>
                                Logout
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </header>

        <!-- ========== MAIN CONTENT ========== -->
        <main>
            <div class="container">
                <div layout:fragment="content">
                    <!-- Page-specific content will be inserted here -->
                </div>
            </div>
        </main>

        <!-- ========== FOOTER ========== -->
        <footer>
            <div class="container">
                <p>&copy; 2026 <strong>TaskManager</strong>. All rights reserved. | 
                    <a href="#">Privacy Policy</a> • 
                    <a href="#">Terms of Service</a>
                </p>
            </div>
        </footer>
    </div>
</body>
</html>
