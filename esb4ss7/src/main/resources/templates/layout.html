<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE | TaskManager">TaskManager</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- ========== NAVBAR ========== -->
    <nav class="navbar navbar-expand-lg navbar-custom shadow-sm sticky-top">
        <div class="container">
            <!-- Brand -->
            <a class="navbar-brand fw-bold text-white d-flex align-items-center gap-2" th:href="@{/home}">
                <i class="bi bi-check2-square fs-4"></i>
                <span>TaskManager</span>
            </a>

            <!-- Mobile Toggler -->
            <button class="navbar-toggler border-0 text-white" type="button"
                    data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <i class="bi bi-list fs-3"></i>
            </button>

            <!-- Nav Links -->
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-3">
                    <li class="nav-item">
                        <a class="nav-link text-white nav-link-custom"
                           th:href="@{/home}"
                           th:classappend="${#httpServletRequest.getRequestURI() == '/home' ? 'active-nav' : ''}">
                            <i class="bi bi-house me-1"></i>Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white nav-link-custom"
                           th:href="@{/tasks}"
                           th:classappend="${#httpServletRequest.getRequestURI().startsWith('/tasks') ? 'active-nav' : ''}">
                            <i class="bi bi-list-task me-1"></i>My Tasks
                        </a>
                    </li>
                </ul>

                <!-- Right Side: User & Logout -->
                <div class="d-flex align-items-center gap-3">
                    <span class="text-white-75 small" sec:authorize="isAuthenticated()">
                        <i class="bi bi-person-circle me-1"></i>
                        Welcome, <strong class="text-white" sec:authentication="name"></strong>
                    </span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-light btn-sm fw-semibold px-3">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="flex-grow-1 py-4 py-md-5">
        <div class="container">
            <div layout:fragment="content">
                <!-- Page-specific content will be inserted here -->
            </div>
        </div>
    </main>

    <!-- ========== FOOTER ========== -->
    <footer class="footer-custom py-4 mt-auto">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-start mb-2 mb-md-0">
                    <span class="fw-semibold text-white">
                        <i class="bi bi-check2-square me-1"></i>TaskManager
                    </span>
                    <span class="text-white-50 ms-2 small">&copy; 2026 All rights reserved.</span>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <a href="#" class="text-white-50 small text-decoration-none me-3">Privacy Policy</a>
                    <a href="#" class="text-white-50 small text-decoration-none">Terms of Service</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
