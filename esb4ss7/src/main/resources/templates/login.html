<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{auth-layout}">
<head>
    <title>Login</title>
</head>
<body>
<div layout:fragment="content">

    <h2 class="h4 fw-bold text-center mb-4 text-dark">Sign In</h2>

    <!-- Error Alert -->
    <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2 rounded-3 mb-3" role="alert">
        <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
        <span>Invalid username or password. Please try again.</span>
    </div>

    <!-- Logout Success Alert -->
    <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center gap-2 rounded-3 mb-3" role="alert">
        <i class="bi bi-check-circle-fill flex-shrink-0"></i>
        <span>You have been successfully logged out.</span>
    </div>

    <!-- Login Form -->
    <form method="POST" th:action="@{/login}">
        <div class="mb-3">
            <label for="username" class="form-label fw-semibold small text-dark">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-person text-muted"></i>
                </span>
                <input type="text" id="username" name="username"
                       class="form-control border-start-0 ps-0"
                       placeholder="Enter your username"
                       required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label fw-semibold small text-dark">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-lock text-muted"></i>
                </span>
                <input type="password" id="password" name="password"
                       class="form-control border-start-0 ps-0"
                       placeholder="Enter your password"
                       required>
            </div>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg fw-semibold rounded-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
        </div>
    </form>

    <!-- Divider -->
    <div class="auth-divider">or</div>

    <!-- Sign Up Link -->
    <p class="text-center text-muted small mb-0">
        Don't have an account?
        <a th:href="@{/register}" class="text-primary fw-semibold text-decoration-none">Create one now</a>
    </p>

</div>
</body>
</html>
